<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RLC Lab — where linear algebra meets AC/DC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#eef0f2;
    --bezel-1:#d9dcdf;
    --bezel-2:#c5c9cd;
    --bezel-edge:#ffffff;
    --panel-text:#1b2024;
    --panel-text-dim:#5b6169;
    --divider: rgba(0,0,0,.14);
    --accent:#9a5900;
    --accent-strong:#c97600;
    --wire:#6b7178;
    --led-off:#5b3a1a;
    --led-on:#ffb000;
    --focus:#2266dd;
    --slider-track:#b9bcc0;
    --slider-track-2:#a7abb0;
    --screen-bg:#05080a;
    --screen-grid: rgba(96,150,118,.24);
    --screen-grid-strong: rgba(96,150,118,.4);
    --trace-v:#ffb000;
    --trace-i:#49d7e6;
    --screen-text: rgba(210,225,215,.55);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page-bg:#05070a;
      --bezel-1:#191e25;
      --bezel-2:#0d1116;
      --bezel-edge:#323a44;
      --panel-text:#e7e9ea;
      --panel-text-dim:#8a93a0;
      --divider: rgba(255,255,255,.09);
      --accent:#ffb000;
      --accent-strong:#ffcf66;
      --wire:#8a93a0;
      --led-off:#3a2a16;
      --slider-track:#262c34;
      --slider-track-2:#181d24;
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#05070a;
    --bezel-1:#191e25;
    --bezel-2:#0d1116;
    --bezel-edge:#323a44;
    --panel-text:#e7e9ea;
    --panel-text-dim:#8a93a0;
    --divider: rgba(255,255,255,.09);
    --accent:#ffb000;
    --accent-strong:#ffcf66;
    --wire:#8a93a0;
    --led-off:#3a2a16;
    --slider-track:#262c34;
    --slider-track-2:#181d24;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--page-bg);
    color:var(--panel-text);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    padding:28px 16px 60px;
    display:flex;
    justify-content:center;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }

  .rig{
    width:100%;
    max-width:1080px;
  }

  .panel{
    position:relative;
    background:linear-gradient(160deg, var(--bezel-1), var(--bezel-2));
    border-radius:16px;
    box-shadow: 0 24px 48px rgba(0,0,0,.28), inset 0 1px 0 var(--bezel-edge);
    padding:22px 22px 26px;
  }
  .screw{
    position:absolute;
    width:9px; height:9px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff8, #7778 55%, #0006 100%);
    box-shadow: inset 0 0 2px rgba(0,0,0,.6);
  }
  .screw.tl{top:12px; left:12px;} .screw.tr{top:12px; right:12px;}
  .screw.bl{bottom:12px; left:12px;} .screw.br{bottom:12px; right:12px;}

  header.rig-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    padding-bottom:16px;
    margin-bottom:18px;
    border-bottom:1px solid var(--divider);
  }
  .title-block h1{
    font-size:19px;
    margin:0 0 3px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .title-block p{
    margin:0;
    color:var(--panel-text-dim);
    font-size:13px;
  }
  .status-block{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .led{
    width:9px; height:9px; border-radius:50%;
    background:var(--led-on);
    box-shadow: 0 0 6px 2px color-mix(in srgb, var(--led-on) 70%, transparent), inset 0 0 2px rgba(0,0,0,.4);
    flex:none;
  }
  .led-label{ font-size:11px; color:var(--panel-text-dim); }

  .toggle{
    display:flex;
    align-items:center;
    background:var(--slider-track-2);
    border-radius:999px;
    padding:3px;
    gap:2px;
    border:1px solid var(--divider);
  }
  .toggle input{ position:absolute; opacity:0; pointer-events:none; }
  .toggle label{
    position:relative;
    z-index:1;
    font-size:11px;
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.03em;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    color:var(--panel-text-dim);
    transition: color .25s ease;
    user-select:none;
  }
  .toggle .thumb{
    position:absolute;
    top:3px; left:3px;
    height:calc(100% - 6px);
    width:calc(50% - 3px);
    background:var(--accent);
    border-radius:999px;
    transition: transform .28s cubic-bezier(.4,0,.2,1);
  }
  #modeSwitch:checked ~ .thumb{ transform: translateX(100%); }
  .toggle label[data-side="a"]{ color: var(--panel-text); }
  #modeSwitch:checked ~ label[data-side="a"]{ color: var(--panel-text-dim); }
  #modeSwitch:checked ~ label[data-side="b"]{ color:#100c00; }
  #modeSwitch:not(:checked) ~ label[data-side="a"]{ color:#100c00; }
  #modeSwitch:focus-visible ~ .thumb{ outline:2px solid var(--focus); outline-offset:2px; }

  main.deck{
    display:grid;
    grid-template-columns: 250px 1fr;
    gap:20px;
  }
  @media (max-width: 720px){
    main.deck{ grid-template-columns: 1fr; }
  }

  .schem-col, .scope-col{ display:flex; flex-direction:column; gap:14px; }

  .card{
    background: color-mix(in srgb, var(--bezel-2) 70%, transparent);
    border:1px solid var(--divider);
    border-radius:10px;
    padding:12px 14px;
  }
  .card h2{
    font-size:11px;
    margin:0 0 8px;
    color:var(--panel-text-dim);
    font-weight:600;
    letter-spacing:.04em;
  }

  svg.schematic{ width:100%; height:auto; display:block; }
  .schem-wire{ fill:none; stroke:var(--wire); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
  .schem-part{ fill:none; stroke:var(--panel-text); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
  .schem-plate{ stroke:var(--panel-text); stroke-width:3; }
  .schem-label{ fill:var(--panel-text-dim); font-size:9px; font-family:'IBM Plex Mono', monospace; }
  .schem-value{ fill:var(--accent); font-size:9.5px; font-family:'IBM Plex Mono', monospace; font-weight:600; }

  .readout-lines{ font-size:12px; line-height:1.65; white-space:pre-wrap; }
  .readout-lines .k{ color:var(--panel-text-dim); }
  .readout-lines .v{ color:var(--panel-text); font-weight:600; }
  .readout-lines .flag{ color:var(--accent-strong); font-weight:600; }

  .scope-screen{
    position:relative;
    background:var(--screen-bg);
    border-radius:8px;
    padding:10px;
    box-shadow: inset 0 0 22px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .scope-screen canvas{ display:block; width:100%; height:230px; }
  .scope-tag{
    position:absolute;
    top:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    padding:1px 0;
  }
  .scope-tag.v{ left:20px; color:var(--trace-v); }
  .scope-tag.i{ right:20px; color:var(--trace-i); text-align:right; }

  .plane-screen{
    background:var(--screen-bg);
    border-radius:8px;
    padding:10px;
    box-shadow: inset 0 0 22px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04);
    display:flex;
    gap:12px;
    align-items:center;
  }
  .plane-screen canvas{ display:block; width:150px; height:150px; flex:none; }
  .plane-caption{
    font-size:11.5px;
    color: var(--screen-text);
    font-family:'IBM Plex Mono', monospace;
    line-height:1.6;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--divider);
  }
  .control{ flex:1 1 190px; min-width:170px; }
  .control-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .control-top label{ font-size:12px; color:var(--panel-text-dim); }
  .control-top output{ font-size:12.5px; font-family:'IBM Plex Mono', monospace; color:var(--panel-text); font-weight:600; }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:4px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--slider-track), var(--slider-track-2));
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px; height:16px;
    border-radius:50%;
    background:var(--accent);
    border:2px solid var(--bezel-edge);
    box-shadow:0 1px 3px rgba(0,0,0,.4);
    cursor:pointer;
    margin-top:0;
  }
  input[type="range"]::-moz-range-thumb{
    width:16px; height:16px;
    border-radius:50%;
    background:var(--accent);
    border:2px solid var(--bezel-edge);
    cursor:pointer;
  }
  input[type="range"]:focus-visible::-webkit-slider-thumb{ outline:2px solid var(--focus); outline-offset:2px; }

  #freqControl{ transition: opacity .2s ease; }
  #freqControl[hidden]{ display:none; }

  .diagnostic{
    margin-top:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--accent-strong);
    background: color-mix(in srgb, var(--screen-bg) 92%, var(--bezel-2));
    border-radius:8px;
    padding:10px 14px;
    border:1px solid var(--divider);
  }

  .explainer{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--divider);
    font-size:13.5px;
    line-height:1.65;
    color:var(--panel-text-dim);
    max-width:74ch;
  }
  .explainer strong{ color:var(--panel-text); font-weight:600; }

  footer.credit{
    text-align:center;
    font-size:11.5px;
    color:var(--panel-text-dim);
    margin-top:14px;
  }

  @media (prefers-reduced-motion: reduce){
    .toggle .thumb{ transition:none; }
  }
</style>
</head>
<body>

<div class="rig">
  <div class="panel">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>

    <header class="rig-header">
      <div class="title-block">
        <h1>RLC LAB</h1>
        <p>one circuit, one matrix, two ways to watch it move</p>
      </div>
      <div class="status-block">
        <div style="display:flex; align-items:center; gap:6px;">
          <span class="led" aria-hidden="true"></span>
          <span class="led-label mono">ENERGIZED</span>
        </div>
        <div class="toggle">
          <input type="checkbox" id="modeSwitch" aria-label="Toggle between step response and steady-state AC view">
          <label data-side="a" id="modeALabel">STEP</label>
          <label data-side="b" id="modeBLabel">AC&nbsp;SS</label>
          <span class="thumb" aria-hidden="true"></span>
        </div>
      </div>
    </header>

    <main class="deck">
      <section class="schem-col">
        <div class="card">
          <h2>CIRCUIT</h2>
          <svg class="schematic" viewBox="0 0 300 200" role="img" aria-label="Series RLC circuit schematic">
            <!-- top wire + resistor -->
            <path class="schem-wire" d="M40,40 L90,40 L96,26 L104,54 L112,26 L120,54 L128,26 L136,54 L144,26 L152,40 L260,40"/>
            <text class="schem-label" x="108" y="18">R</text>
            <text class="schem-value" id="lblR" x="96" y="70">20 Ω</text>

            <!-- right wire + inductor -->
            <path class="schem-wire" d="M260,40 L260,58 A9,9 0 0 1 260,76 A9,9 0 0 0 260,94 A9,9 0 0 1 260,112 A9,9 0 0 0 260,130 A9,9 0 0 1 260,142 L260,160"/>
            <text class="schem-label" x="271" y="103">L</text>
            <text class="schem-value" id="lblL" x="230" y="185">50 mH</text>

            <!-- bottom wire + capacitor -->
            <path class="schem-wire" d="M260,160 L172,160"/>
            <line class="schem-plate" x1="158" y1="148" x2="158" y2="172"/>
            <line class="schem-plate" x1="148" y1="148" x2="148" y2="172"/>
            <path class="schem-wire" d="M134,160 L40,160"/>
            <text class="schem-label" x="140" y="182">C</text>
            <text class="schem-value" id="lblC" x="20" y="185">20 µF</text>

            <!-- left wire + source, DC variant -->
            <g id="sourceDC">
              <path class="schem-wire" d="M40,160 L40,116"/>
              <line class="schem-part" x1="25" y1="112" x2="55" y2="112"/>
              <line class="schem-part" x1="33" y1="105" x2="47" y2="105" stroke-width="4.5"/>
              <line class="schem-part" x1="25" y1="97" x2="55" y2="97"/>
              <line class="schem-part" x1="33" y1="90" x2="47" y2="90" stroke-width="4.5"/>
              <path class="schem-wire" d="M40,90 L40,78"/>
              <circle class="schem-part" cx="40" cy="74" r="2.4" fill="var(--panel-text)"/>
              <path class="schem-part" d="M40,74 L52,58"/>
              <circle class="schem-part" cx="40" cy="54" r="2.4" fill="var(--panel-text)"/>
              <path class="schem-wire" d="M40,54 L40,40"/>
              <text class="schem-label" x="4" y="103">V₀</text>
              <text class="schem-label" x="52" y="68">SW</text>
            </g>

            <!-- left wire + source, AC variant -->
            <g id="sourceAC" style="display:none">
              <path class="schem-wire" d="M40,160 L40,118"/>
              <circle class="schem-part" cx="40" cy="100" r="18"/>
              <path class="schem-part" d="M28,100 Q34,88 40,100 Q46,112 52,100" stroke-width="2"/>
              <path class="schem-wire" d="M40,82 L40,40"/>
              <text class="schem-value" id="lblSource" x="-4" y="132">10 V, 159 Hz</text>
            </g>
          </svg>
        </div>

        <div class="card">
          <h2 id="readoutTitle">STATE (s-DOMAIN)</h2>
          <div class="readout-lines mono" id="readoutPanel" aria-live="off"></div>
        </div>
      </section>

      <section class="scope-col">
        <div class="card" style="padding:10px;">
          <div class="scope-screen">
            <span class="scope-tag v" id="tagV">V_C peak —</span>
            <span class="scope-tag i" id="tagI">i peak —</span>
            <canvas id="scopeCanvas"></canvas>
          </div>
        </div>

        <div class="card" style="padding:10px;">
          <div class="plane-screen">
            <canvas id="planeCanvas"></canvas>
            <div class="plane-caption" id="planeCaption"></div>
          </div>
        </div>
      </section>
    </main>

    <div class="controls">
      <div class="control">
        <div class="control-top"><label for="rSlider">Resistance R</label><output id="rVal" class="mono">20 Ω</output></div>
        <input type="range" id="rSlider" min="1" max="500" value="20" step="1" aria-describedby="rVal">
      </div>
      <div class="control">
        <div class="control-top"><label for="lSlider">Inductance L</label><output id="lVal" class="mono">50 mH</output></div>
        <input type="range" id="lSlider" min="1" max="200" value="50" step="1" aria-describedby="lVal">
      </div>
      <div class="control">
        <div class="control-top"><label for="cSlider">Capacitance C</label><output id="cVal" class="mono">20 µF</output></div>
        <input type="range" id="cSlider" min="1" max="100" value="20" step="1" aria-describedby="cVal">
      </div>
      <div class="control" id="freqControl" hidden>
        <div class="control-top"><label for="fSlider">Drive frequency f</label><output id="fVal" class="mono">159 Hz</output></div>
        <input type="range" id="fSlider" min="0" max="1000" value="500" step="1" aria-describedby="fVal">
      </div>
    </div>

    <div class="diagnostic mono" id="diagLine" aria-live="polite">—</div>

    <div class="explainer">
      <p id="explainText"></p>
    </div>
  </div>

  <footer class="credit">Nothing here is precomputed — every trace, eigenvalue and phasor is solved live from the sliders' current R, L and C.</footer>
</div>

<script>
(function(){
  "use strict";

  // ---------- complex number helpers ----------
  const C_ = {
    add:(a,b)=>({re:a.re+b.re, im:a.im+b.im}),
    sub:(a,b)=>({re:a.re-b.re, im:a.im-b.im}),
    mul:(a,b)=>({re:a.re*b.re-a.im*b.im, im:a.re*b.im+a.im*b.re}),
    div:(a,b)=>{ const d=b.re*b.re+b.im*b.im || 1e-30;
      return {re:(a.re*b.re+a.im*b.im)/d, im:(a.im*b.re-a.re*b.im)/d}; },
    scale:(a,s)=>({re:a.re*s, im:a.im*s}),
    exp:(a)=>{ const ex=Math.exp(a.re); return {re:ex*Math.cos(a.im), im:ex*Math.sin(a.im)}; },
    neg:(a)=>({re:-a.re, im:-a.im}),
    abs:(a)=>Math.hypot(a.re,a.im),
    arg:(a)=>Math.atan2(a.im,a.re),
    re:(n)=>({re:n, im:0})
  };

  // ---------- state ----------
  const state = {
    mode: 'transient',   // 'transient' | 'ac'
    R: 20, L_mH: 50, C_uF: 20, f_Hz: 159,
    V0: 10,
    sweepT: 0,
    scrollPhase: 0,
    reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
    derived: null
  };

  const SWEEP_DUR = 2.2, HOLD_DUR = 1.6, CYCLE = SWEEP_DUR + HOLD_DUR;
  const OMEGA_VIS = 2*Math.PI*0.12; // slow illustrative rotation/scroll rate

  // ---------- DOM refs ----------
  const el = id => document.getElementById(id);
  const rSlider=el('rSlider'), lSlider=el('lSlider'), cSlider=el('cSlider'), fSlider=el('fSlider');
  const rVal=el('rVal'), lVal=el('lVal'), cVal=el('cVal'), fVal=el('fVal');
  const freqControl = el('freqControl');
  const modeSwitch = el('modeSwitch');
  const scopeCanvas = el('scopeCanvas'), planeCanvas = el('planeCanvas');
  const tagV = el('tagV'), tagI = el('tagI');
  const readoutPanel = el('readoutPanel'), readoutTitle = el('readoutTitle');
  const diagLine = el('diagLine'), planeCaption = el('planeCaption'), explainText = el('explainText');
  const lblR = el('lblR'), lblL = el('lblL'), lblC = el('lblC'), lblSource = el('lblSource');
  const sourceDC = el('sourceDC'), sourceAC = el('sourceAC');

  let ctxScope, ctxPlane;
  function fitCanvas(canvas){
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(rect.width*dpr));
    canvas.height = Math.max(1, Math.round(rect.height*dpr));
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return ctx;
  }
  function refitAll(){
    ctxScope = fitCanvas(scopeCanvas);
    ctxPlane = fitCanvas(planeCanvas);
  }

  // ---------- physics: transient (DC step) ----------
  function computeTransient(R, L, C, V0){
    const alpha = R/(2*L);
    const omega0sq = 1/(L*C);
    const omega0 = Math.sqrt(omega0sq);
    const disc = alpha*alpha - omega0sq;
    const eps = 1e-6*omega0sq;
    let regime, lambda1, lambda2, wd=null;

    if (Math.abs(disc) < eps){
      regime = 'critical';
      lambda1 = {re:-alpha, im:0}; lambda2 = {re:-alpha, im:0};
    } else if (disc > 0){
      regime = 'over';
      const s = Math.sqrt(disc);
      lambda1 = {re:-alpha+s, im:0};
      lambda2 = {re:-alpha-s, im:0};
    } else {
      regime = 'under';
      wd = Math.sqrt(-disc);
      lambda1 = {re:-alpha, im:wd};
      lambda2 = {re:-alpha, im:-wd};
    }

    // duration to display
    let Ts;
    if (regime === 'over'){
      const slowRate = Math.max(-lambda1.re, 1e-6); // lambda1 closer to 0 => slower mode
      Ts = 5/slowRate;
    } else if (regime === 'critical'){
      Ts = 5/Math.max(alpha,1e-6);
    } else {
      const byDecay = 5/Math.max(alpha,1e-6);
      const period = 2*Math.PI/wd;
      Ts = Math.min(Math.max(byDecay, 3*period), 15*period);
    }
    Ts = Math.min(Math.max(Ts, 0.0006), 4);

    function sample(t){
      let vc, dvcdt;
      if (regime === 'critical'){
        const lam = lambda1.re;
        const e = Math.exp(lam*t);
        vc = V0*(1 + (lam*t - 1)*e);
        dvcdt = V0*lam*lam*t*e;
      } else {
        const diff = C_.sub(lambda2, lambda1);
        const A = C_.scale(C_.div(lambda2, diff), -V0);
        const B = C_.scale(C_.div(lambda1, diff), V0);
        const e1 = C_.exp(C_.scale(lambda1, t));
        const e2 = C_.exp(C_.scale(lambda2, t));
        const vcC = C_.add(C_.add(C_.re(V0), C_.mul(A,e1)), C_.mul(B,e2));
        const dC = C_.add(C_.mul(C_.mul(A,lambda1),e1), C_.mul(C_.mul(B,lambda2),e2));
        vc = vcC.re; dvcdt = dC.re;
      }
      const i = C*dvcdt;
      return {vc, i};
    }

    const N = 420;
    const tArr=new Float64Array(N), vcArr=new Float64Array(N), iArr=new Float64Array(N);
    let vcMax=0.01, iMax=0.0001;
    for (let k=0;k<N;k++){
      const t = (k/(N-1))*Ts;
      const {vc, i} = sample(t);
      tArr[k]=t; vcArr[k]=vc; iArr[k]=i;
      if (Math.abs(vc)>vcMax) vcMax=Math.abs(vc);
      if (Math.abs(i)>iMax) iMax=Math.abs(i);
    }

    return { alpha, omega0, disc, regime, lambda1, lambda2, wd, Ts, tArr, vcArr, iArr, vcMax, iMax };
  }

  // ---------- physics: AC steady state ----------
  function computeAC(R, L, C, f, V0){
    const omega = 2*Math.PI*f;
    const Zr = {re:R, im:0};
    const Zl = {re:0, im:omega*L};
    const Zc = {re:0, im:-1/(omega*C)};
    const Zt = C_.add(C_.add(Zr,Zl),Zc);
    const V = {re:V0, im:0};
    const I = C_.div(V, Zt);
    const VR = C_.mul(I,Zr), VL = C_.mul(I,Zl), VC = C_.mul(I,Zc);
    const omega0 = 1/Math.sqrt(L*C);
    const f0 = omega0/(2*Math.PI);
    return { omega, f0, Zr, Zl, Zc, Zt, V, I, VR, VL, VC,
      ZtMag: C_.abs(Zt), ZtPhase: C_.arg(Zt),
      IMag: C_.abs(I), IPhase: C_.arg(I) };
  }

  // ---------- unit helpers ----------
  const fmt = (v,d=2)=>Number(v).toFixed(d);
  function fmtSI(v, unit, digits=2){
    const av = Math.abs(v);
    if (av === 0) return `0 ${unit}`;
    if (av >= 1000) return `${fmt(v/1000,digits)} k${unit}`;
    if (av < 1) return `${fmt(v*1000,digits)} m${unit}`;
    return `${fmt(v,digits)} ${unit}`;
  }

  // ---------- recompute on slider change ----------
  function recompute(){
    const R = state.R, L = state.L_mH/1000, C = state.C_uF/1e6, f = state.f_Hz, V0 = state.V0;
    const t = computeTransient(R,L,C,V0);
    const a = computeAC(R,L,C,f,V0);
    state.derived = { R, L, C, f, V0, t, a };
    updateSchematicLabels();
    updateReadouts();
    updateDiagnostic();
    updateExplainer();
  }

  function updateSchematicLabels(){
    lblR.textContent = `${state.R} Ω`;
    lblL.textContent = `${state.L_mH} mH`;
    lblC.textContent = `${state.C_uF} µF`;
    if (lblSource) lblSource.textContent = `${state.V0} V, ${Math.round(state.f_Hz)} Hz`;
  }

  function updateReadouts(){
    const d = state.derived;
    if (state.mode === 'transient'){
      readoutTitle.textContent = 'STATE (EIGENVALUES)';
      const t = d.t;
      const regimeName = {over:'OVERDAMPED', critical:'CRITICALLY DAMPED', under:'UNDERDAMPED'}[t.regime];
      const lam1 = t.regime==='under' ? `−${fmt(-t.lambda1.re,0)} + j${fmt(t.wd,0)}` : `${fmt(t.lambda1.re,0)}`;
      const lam2 = t.regime==='under' ? `−${fmt(-t.lambda1.re,0)} − j${fmt(t.wd,0)}` : `${fmt(t.lambda2.re,0)}`;
      readoutPanel.innerHTML =
        `<span class="k">regime</span>  <span class="flag">${regimeName}</span>\n`+
        `<span class="k">α (decay)</span>  <span class="v">${fmtSI(t.alpha,'/s')}</span>\n`+
        `<span class="k">ω₀ (natural)</span>  <span class="v">${fmtSI(t.omega0,'rad/s')}</span>  <span class="k">(${fmt(t.omega0/(2*Math.PI),1)} Hz)</span>\n`+
        `<span class="k">ζ (damping)</span>  <span class="v">${fmt(t.alpha/t.omega0,2)}</span>\n`+
        `<span class="k">λ₁</span>  <span class="v">${lam1} s⁻¹</span>\n`+
        `<span class="k">λ₂</span>  <span class="v">${lam2} s⁻¹</span>\n`+
        `<span class="k">v_C(∞)</span>  <span class="v">${fmt(d.V0,1)} V</span>`;
    } else {
      readoutTitle.textContent = 'STATE (IMPEDANCE)';
      const a = d.a;
      const phDeg = a.ZtPhase*180/Math.PI;
      readoutPanel.innerHTML =
        `<span class="k">f</span>  <span class="v">${fmt(d.f,1)} Hz</span>  <span class="k">(f₀ = ${fmt(a.f0,1)} Hz)</span>\n`+
        `<span class="k">|Z_R|</span>  <span class="v">${fmt(a.Zr.re,1)} Ω</span>\n`+
        `<span class="k">|Z_L|</span>  <span class="v">${fmt(C_.abs(a.Zl),1)} Ω</span>\n`+
        `<span class="k">|Z_C|</span>  <span class="v">${fmt(C_.abs(a.Zc),1)} Ω</span>\n`+
        `<span class="k">Z_total</span>  <span class="v">${fmt(a.ZtMag,1)} Ω ∠ ${fmt(phDeg,1)}°</span>\n`+
        `<span class="k">I_peak</span>  <span class="v">${fmtSI(a.IMag,'A')}</span>  <span class="k">∠ ${fmt(a.IPhase*180/Math.PI,1)}°</span>\n`+
        `<span class="k">V_R / V_L / V_C</span>  <span class="v">${fmt(C_.abs(a.VR),1)} / ${fmt(C_.abs(a.VL),1)} / ${fmt(C_.abs(a.VC),1)} V</span>`;
    }
  }

  function updateDiagnostic(){
    const d = state.derived;
    if (state.mode === 'transient'){
      const t = d.t;
      if (t.regime === 'over'){
        const tau = 1/Math.max(-t.lambda1.re,1e-6);
        diagLine.textContent = `REGIME: OVERDAMPED — settles smoothly to ${fmt(d.V0,1)} V with no ringing (τ ≈ ${fmtSI(tau,'s')})`;
      } else if (t.regime === 'critical'){
        diagLine.textContent = `REGIME: CRITICALLY DAMPED — fastest settle possible without any overshoot`;
      } else {
        diagLine.textContent = `REGIME: UNDERDAMPED — rings at ${fmt(t.wd/(2*Math.PI),1)} Hz before settling, envelope decays as e^(−${fmt(t.alpha,0)}·t)`;
      }
    } else {
      const a = d.a;
      const phDeg = a.ZtPhase*180/Math.PI;
      if (Math.abs(phDeg) < 2){
        diagLine.textContent = `AT RESONANCE (f ≈ f₀) — impedance is purely resistive, current and voltage in phase`;
      } else if (phDeg > 0){
        diagLine.textContent = `INDUCTIVE — current lags voltage by ${fmt(phDeg,1)}°`;
      } else {
        diagLine.textContent = `CAPACITIVE — current leads voltage by ${fmt(-phDeg,1)}°`;
      }
    }
  }

  function updateExplainer(){
    explainText.innerHTML = `Both views come from the same 2×2 matrix — Kirchhoff's voltage law written as `+
      `<strong>dx/dt = Ax</strong>, where x = [current, capacitor voltage]. Flip the switch on and its `+
      `<strong>eigenvalues</strong> decide whether the circuit rings or settles quietly. Drive it with a steady `+
      `sine wave instead, and the same R, L, C become a <strong>complex impedance</strong> whose phase decides `+
      `whether current leads or lags. The frequency where the two views meet — ω₀ = 1/√(LC) — is the resonance `+
      `where an AC circuit stops fighting itself.`;
  }

  // ---------- drawing ----------
  function cssSize(canvas){
    const r = canvas.getBoundingClientRect();
    return {w:r.width, h:r.height};
  }

  function drawGrid(ctx, w, h, divs=8){
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = getVar('--screen-grid');
    ctx.lineWidth = 1;
    for (let i=1;i<divs;i++){
      const x = (i/divs)*w;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
    }
    const rows = Math.round(divs*h/w) || 6;
    for (let j=1;j<rows;j++){
      const y = (j/rows)*h;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    }
    ctx.strokeStyle = getVar('--screen-grid-strong');
    ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
  }

  let cachedVars = {};
  function getVar(name){
    if (!cachedVars[name] || cachedVars.t !== state._themeTick){
      cachedVars[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }
    return cachedVars[name];
  }
  function refreshVarCache(){ cachedVars = {}; }

  function drawScopeTransient(){
    const {w,h} = cssSize(scopeCanvas);
    drawGrid(ctxScope, w, h);
    const d = state.derived.t;
    const cycle = state.reducedMotion ? SWEEP_DUR : (state.sweepT % CYCLE);
    const progress = Math.min(cycle/SWEEP_DUR, 1);
    const nShow = Math.max(2, Math.round(progress * d.tArr.length));

    const midY = h/2;
    const padY = h*0.08;
    const vScale = (h/2 - padY) / d.vcMax;
    const iScale = (h/2 - padY) / d.iMax;

    function path(arr, scale, color){
      ctxScope.beginPath();
      for (let k=0;k<nShow;k++){
        const x = (k/(d.tArr.length-1))*w;
        const y = midY - arr[k]*scale;
        if (k===0) ctxScope.moveTo(x,y); else ctxScope.lineTo(x,y);
      }
      ctxScope.strokeStyle = color;
      ctxScope.lineWidth = 2;
      ctxScope.shadowColor = color;
      ctxScope.shadowBlur = 4;
      ctxScope.stroke();
      ctxScope.shadowBlur = 0;
    }
    path(d.vcArr, vScale, getVar('--trace-v'));
    path(d.iArr, iScale, getVar('--trace-i'));

    if (progress < 1){
      const x = progress * w;
      ctxScope.strokeStyle = 'rgba(255,255,255,.5)';
      ctxScope.lineWidth = 1;
      ctxScope.beginPath(); ctxScope.moveTo(x,0); ctxScope.lineTo(x,h); ctxScope.stroke();
    }

    tagV.textContent = `V_C peak ${fmt(d.vcMax,1)} V`;
    tagI.textContent = `i peak ${fmtSI(d.iMax,'A')}`;
  }

  function drawScopeAC(){
    const {w,h} = cssSize(scopeCanvas);
    drawGrid(ctxScope, w, h);
    const a = state.derived.a;
    const V0 = state.V0;
    const cycles = 3;
    const span = cycles*2*Math.PI;
    const midY = h/2;
    const padY = h*0.1;
    const vScale = (h/2-padY)/Math.max(V0,1e-6);
    const iScale = (h/2-padY)/Math.max(a.IMag,1e-9);

    function drawWave(phase0, ampFn, scale, color){
      ctxScope.beginPath();
      const steps = 260;
      for (let k=0;k<=steps;k++){
        const x = (k/steps)*w;
        const theta = state.scrollPhase + (k/steps)*span;
        const y = midY - ampFn(theta)*scale;
        if (k===0) ctxScope.moveTo(x,y); else ctxScope.lineTo(x,y);
      }
      ctxScope.strokeStyle = color; ctxScope.lineWidth = 2;
      ctxScope.shadowColor = color; ctxScope.shadowBlur = 4;
      ctxScope.stroke(); ctxScope.shadowBlur = 0;
    }
    drawWave(0, th=>V0*Math.cos(th), vScale, getVar('--trace-v'));
    drawWave(a.IPhase, th=>a.IMag*Math.cos(th+a.IPhase), iScale, getVar('--trace-i'));

    tagV.textContent = `V peak ${fmt(V0,1)} V`;
    tagI.textContent = `i peak ${fmtSI(a.IMag,'A')}`;
  }

  function drawPlaneEigen(){
    const {w,h} = cssSize(planeCanvas);
    ctxPlane.clearRect(0,0,w,h);
    const d = state.derived.t;
    const cx=w/2, cy=h/2;
    const scale = (w*0.42) / Math.max(Math.abs(d.lambda1.re), Math.abs(d.wd||1), state.derived.t.omega0*0.001, 1);

    ctxPlane.strokeStyle = getVar('--screen-grid-strong');
    ctxPlane.lineWidth = 1;
    ctxPlane.beginPath(); ctxPlane.moveTo(0,cy); ctxPlane.lineTo(w,cy); ctxPlane.stroke();
    ctxPlane.beginPath(); ctxPlane.moveTo(cx,0); ctxPlane.lineTo(cx,h); ctxPlane.stroke();

    function dot(pt, color){
      const x = cx + pt.re*scale;
      const y = cy - pt.im*scale;
      ctxPlane.beginPath(); ctxPlane.arc(x,y,4,0,Math.PI*2);
      ctxPlane.fillStyle = color; ctxPlane.fill();
    }
    dot(d.lambda1, getVar('--trace-v'));
    dot(d.lambda2, getVar('--trace-i'));

    ctxPlane.fillStyle = getVar('--screen-text');
    ctxPlane.font = '9px IBM Plex Mono, monospace';
    ctxPlane.fillText('Re', w-16, cy-6);
    ctxPlane.fillText('jIm', cx+6, 10);

    planeCaption.textContent = d.regime === 'under'
      ? `λ pair off the real axis → the imaginary part (±j${fmt(d.wd,0)}) is the ringing frequency; the real part (−${fmt(-d.lambda1.re,0)}) is how fast it dies out.`
      : `λ on the real axis only → pure exponential settling, no ringing frequency to speak of.`;
  }

  function drawPlanePhasor(){
    const {w,h} = cssSize(planeCanvas);
    ctxPlane.clearRect(0,0,w,h);
    const a = state.derived.a;
    const cx=w/2, cy=h/2;
    const R = w*0.4;
    const maxMag = Math.max(state.V0, a.IMag*state.V0/Math.max(a.IMag,1e-9)); // normalize separately below

    ctxPlane.strokeStyle = getVar('--screen-grid-strong');
    ctxPlane.beginPath(); ctxPlane.arc(cx,cy,R,0,Math.PI*2); ctxPlane.stroke();
    ctxPlane.beginPath(); ctxPlane.moveTo(0,cy); ctxPlane.lineTo(w,cy); ctxPlane.stroke();
    ctxPlane.beginPath(); ctxPlane.moveTo(cx,0); ctxPlane.lineTo(cx,h); ctxPlane.stroke();

    function arrow(angle, mag, maxMagLocal, color){
      const len = R * 0.85 * (mag/maxMagLocal);
      const x = cx + len*Math.cos(angle);
      const y = cy - len*Math.sin(angle);
      ctxPlane.beginPath(); ctxPlane.moveTo(cx,cy); ctxPlane.lineTo(x,y);
      ctxPlane.strokeStyle = color; ctxPlane.lineWidth = 2.4;
      ctxPlane.shadowColor = color; ctxPlane.shadowBlur = 5;
      ctxPlane.stroke(); ctxPlane.shadowBlur = 0;
      const ah = 6, aa = Math.atan2(-Math.sin(angle),Math.cos(angle));
      ctxPlane.beginPath();
      ctxPlane.moveTo(x,y);
      ctxPlane.lineTo(x - ah*Math.cos(angle-0.4), y + ah*Math.sin(angle-0.4));
      ctxPlane.lineTo(x - ah*Math.cos(angle+0.4), y + ah*Math.sin(angle+0.4));
      ctxPlane.closePath(); ctxPlane.fillStyle = color; ctxPlane.fill();
    }
    const angV = state.scrollPhase;
    const angI = state.scrollPhase + a.IPhase;
    arrow(angV, state.V0, state.V0, getVar('--trace-v'));
    arrow(angI, a.IMag, a.IMag, getVar('--trace-i'));

    const phDeg = a.ZtPhase*180/Math.PI;
    planeCaption.textContent = Math.abs(phDeg) < 2
      ? `V and I spin together — the circuit looks purely resistive at this frequency.`
      : `The angle between the arrows (${fmt(Math.abs(phDeg),1)}°) is arg(Z) — the same phase you'd read off a lab oscilloscope.`;
  }

  // ---------- animation loop ----------
  let lastTime = performance.now();
  function frame(now){
    const dt = Math.min((now-lastTime)/1000, 0.05);
    lastTime = now;
    if (!state.reducedMotion){
      state.sweepT += dt;
      state.scrollPhase += dt*OMEGA_VIS;
    }
    if (state.mode === 'transient'){
      drawScopeTransient();
      drawPlaneEigen();
    } else {
      drawScopeAC();
      drawPlanePhasor();
    }
    requestAnimationFrame(frame);
  }

  // ---------- UI wiring ----------
  function setMode(mode){
    state.mode = mode;
    state.sweepT = 0;
    freqControl.hidden = (mode !== 'ac');
    sourceDC.style.display = (mode === 'transient') ? '' : 'none';
    sourceAC.style.display = (mode === 'ac') ? '' : 'none';
    updateReadouts(); updateDiagnostic();
  }

  modeSwitch.addEventListener('change', ()=> setMode(modeSwitch.checked ? 'ac' : 'transient'));
  el('modeALabel').addEventListener('click', ()=>{ modeSwitch.checked=false; setMode('transient'); });
  el('modeBLabel').addEventListener('click', ()=>{ modeSwitch.checked=true; setMode('ac'); });

  rSlider.addEventListener('input', ()=>{ state.R=+rSlider.value; rVal.textContent=`${state.R} Ω`; state.sweepT=0; recompute(); });
  lSlider.addEventListener('input', ()=>{ state.L_mH=+lSlider.value; lVal.textContent=`${state.L_mH} mH`; state.sweepT=0; recompute(); });
  cSlider.addEventListener('input', ()=>{ state.C_uF=+cSlider.value; cVal.textContent=`${state.C_uF} µF`; state.sweepT=0; recompute(); });
  fSlider.addEventListener('input', ()=>{
    const v = +fSlider.value/1000;
    state.f_Hz = 1 * Math.pow(2000/1, v);
    fVal.textContent = `${fmt(state.f_Hz,0)} Hz`;
    recompute();
  });

  // set initial frequency slider position to match default f_Hz (~159 Hz)
  (function initFreqSlider(){
    const target = state.f_Hz;
    const v = Math.log(target/1) / Math.log(2000/1) * 1000;
    fSlider.value = Math.round(v);
    fVal.textContent = `${fmt(state.f_Hz,0)} Hz`;
  })();

  window.addEventListener('resize', ()=>{ refitAll(); });

  // ---------- boot ----------
  refitAll();
  recompute();
  setMode('transient');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
